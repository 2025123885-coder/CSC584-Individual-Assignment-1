<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="page">
        <div class="card">
    <header class="intro">
        <h2>Student Profile Registration</h2>
    </header>
        
        <form action="profileServlet" method="post">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="fullName" name="Name" placeholder="e.g. Ali Bin Abu" required>
            </div>

            <div class="form-group">
                <label for="studentId">Student ID</label>
                <input type="text" id="studentId" name="Student ID" placeholder="e.g. 2025123456" required>
            </div>

            <div class="form-group">
                <label for="programme">Programme</label>
                <input type="text" id="programme" name="Programme" placeholder="e.g. CS240 - Bachelor of Information Technology" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="Email" placeholder="e.g. 2025123456@student.uitm.edu.my" required>
            </div>

            <div class="form-group">
                <label for="hobbies">Hobbies</label>
                <input type="text" id="hobbies" name="Hobbies" placeholder="e.g. Coding, Gaming, Badminton" required>
            </div>

            <div class="form-group">
                <label for="bio">Short Self-Introduction</label>
                <textarea id="bio" name="Short Self-Introduction" rows="4" 
                          placeholder="Briefly describe yourself, your academic goals, or interests..." required></textarea>
            </div>

            <button type="submit" class="btn">Submit</button>
        </form>
    </div>
    </main>
</body>
</html>
